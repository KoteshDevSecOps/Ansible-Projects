- name: demo on variables
  hosts: localhost
  connection: local
  vars:
    COURSE: "Ansible for Beginners"
    TRAINER: "KB"
    DURATION: "10 days"
  tasks:
  - name: print information
    vars: 
      COURSE: "dEVsEVoPS WITH ai"
  - debug:
      msg: "Hi I am learning{{ COURSE }}, Trainer is {{ TRAINER }}, Duration is {{ DURATION }}"