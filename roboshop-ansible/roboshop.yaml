- name: roboshop instances management
  hosts: local
  connection: local
  vars: 
    instances: ["mongodb", "redis", "mysql", "rabbitmq", "frontend"]
    image_id: ami-0220d79f3f480ecf5
    action: create
  tasks: 
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      name: "roboshop-{{ item }}"
      image_id: "{{ image_id }}"
      security_groups:  
      - "Seg-Common"
    loop: "{{ instances }}"
    register: ec2_output
    when: action == "create"

 # - name: print ec2 output
 #   debug:
  #    msg: "{{ ec2_output.results }}"
    
 # - name: create route53 record
   # debug: 
  #    msg: "Instance Name: {{ item.item}} privateIP: {{ item.instances[0].private_ip_address }}"
  #  loop: "{{ ec2_output.results }}"
  - name: create route53 receord
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: item.item == "frontend"

  - name: create route53 receord for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: 
    - item.item == "frontend"
    - action == "create"

    - name: delete r53 record
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        ttl: 1
        type: A
      loop: "{{ ec2_output.results }}"
      when: 
      - item.item == "frontend"
      - action == "delete"
    - name: delete r53 record for frontend
      amazon.aws.route53:
        state: absent
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}"
        ttl: 1
        type: A
      loop: "{{ instances }}"
      when: 
      - item == "frontend"
      - action == "delete"